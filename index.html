<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E6">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solfège">
<title>Solfège</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root {
  /* Une page de méthode : papier, encre, crayon bleu pour le repère, crayon rouge pour l'erreur. Rien d'autre. */
  --paper: #F5F1E6;
  --ink: #1C1A17;
  --soft: #6B6457;
  --hair: rgba(28, 26, 23, 0.28);
  --red: #B3261E;
  --blue: #1F4E8C;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.4;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
main {
  min-height: 100%; display: flex; flex-direction: column; align-items: center;
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

#home { justify-content: center; gap: 36px; }
h1 { margin: 0; font-size: 44px; line-height: 1; font-weight: 400; font-style: italic; }
.choice { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
.choice button { min-height: 44px; padding: 0 2px; color: var(--soft); border-bottom: 2px solid transparent; }
.choice button[aria-checked="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.primary { min-height: 56px; min-width: 220px; padding: 0 28px; background: var(--ink); color: var(--paper); font-size: 20px; }
.primary:disabled { opacity: 0.5; }
#msg { margin: 0; min-height: 1.4em; max-width: 30em; text-align: center; font-size: 16px; font-style: italic; color: var(--soft); }

#page { gap: 0; }
#bar { width: 100%; max-width: 760px; height: 44px; display: flex; align-items: center; justify-content: space-between; flex: none; }
#quit { width: 44px; height: 44px; margin-left: -12px; font-size: 30px; line-height: 1; color: var(--soft); }
#mic { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); opacity: 0.15; transform: scale(0.6); }
#systems { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 8px; align-items: center; flex: none; }
#systems svg { display: block; overflow: visible; }   /* une annotation en bout de portée déborde dans la marge au lieu d'être coupée */
#foot { width: 100%; max-width: 760px; margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 104px; }
#result { margin: 0; text-align: center; font-size: 20px; min-height: 1.4em; }
#result small { display: block; font-size: 15px; font-style: italic; color: var(--soft); }
#after { display: flex; gap: 28px; }
#after button { min-height: 44px; font-style: italic; text-decoration: underline; text-underline-offset: 4px; }
#debug { width: 100%; max-width: 760px; margin: 8px 0 0; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--soft); white-space: pre-wrap; word-break: break-word; }
#share { font: 13px/1.4 ui-monospace, Menlo, monospace; text-decoration: underline; min-height: 44px; }
</style>
</head>
<body>
<main id="home">
  <h1>Solfège</h1>
  <div class="choice" id="clef" role="radiogroup" aria-label="Clé">
    <button type="button" role="radio" aria-checked="true" data-v="sol">Clé de sol</button>
    <button type="button" role="radio" aria-checked="false" data-v="fa">Clé de fa</button>
    <button type="button" role="radio" aria-checked="false" data-v="deux">Les deux</button>
  </div>
  <div class="choice" id="input" role="radiogroup" aria-label="Façon de répondre" hidden>
    <button type="button" role="radio" aria-checked="true" data-v="voix">À la voix</button>
    <button type="button" role="radio" aria-checked="false" data-v="midi">Au clavier</button>
  </div>
  <button type="button" class="primary" id="go">Commencer</button>
  <p id="msg" role="status"></p>
</main>
<main id="page" hidden>
  <div id="bar">
    <button type="button" id="quit" aria-label="Terminer la page">×</button>
    <span id="mic" aria-hidden="true"></span>
  </div>
  <div id="systems" aria-live="off"></div>
  <div id="foot">
    <p id="result" role="status"></p>
    <div id="after" hidden>
      <button type="button" id="again">Encore</button>
      <button type="button" id="done">Terminer</button>
    </div>
    <button type="button" id="share" hidden>Partager l'audio de la séance</button>
    <pre id="debug" hidden></pre>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E6">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solfège">
<title>Solfège</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root {
  /* Une page de méthode : papier, encre, crayon bleu pour le repère, crayon rouge pour l'erreur. Rien d'autre. */
  --paper: #F5F1E6;
  --ink: #1C1A17;
  --soft: #6B6457;
  --hair: rgba(28, 26, 23, 0.28);
  --red: #B3261E;
  --blue: #1F4E8C;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.4;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
main {
  min-height: 100%; display: flex; flex-direction: column; align-items: center;
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

#home { justify-content: center; gap: 26px; }
h1 { margin: 0; font-size: 44px; line-height: 1; font-weight: 400; font-style: italic; }
#liste { display: flex; flex-direction: column; align-items: center; }
.rubrique { margin: 16px 0 0; font-size: 15px; font-style: italic; color: var(--soft); }
#liste button { min-height: 48px; padding: 0 9px; font-size: 21px; }
.exos { display: flex; flex-wrap: wrap; justify-content: center; }
#choix { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; width: 100%; max-width: 440px; margin-top: 14px; }
#choix button { min-height: 46px; font-size: 17px; }
#choix button.faux { color: #B3261E; text-decoration: line-through; }
#choix button.bon { color: #2E7A3C; }
.icone { width: 44px; height: 44px; display: inline-grid; place-items: center; color: var(--soft); }
.icone.grand { width: 96px; height: 96px; color: var(--ink); }
#mainslibres { width: 56px; height: 56px; }
.ml { display: flex; flex-direction: column; align-items: center; }
.ml button { min-height: 48px; padding: 0 9px; font-size: 21px; }
.ml .manque { color: var(--soft); }
.ml .fait::after { content: ' ✓'; font-size: 15px; color: var(--soft); }
#apres { display: flex; gap: 22px; justify-content: center; margin-top: 10px; min-height: 44px; }
.choice { display: flex; gap: 6px 22px; flex-wrap: wrap; justify-content: center; }
.choice button { min-height: 44px; padding: 0 2px; color: var(--soft); border-bottom: 2px solid transparent; }
.choice button[aria-checked="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.primary { min-height: 56px; min-width: 220px; padding: 0 28px; background: var(--ink); color: var(--paper); font-size: 20px; }
.lien { min-height: 44px; font-style: italic; text-decoration: underline; text-underline-offset: 4px; }
#msg { margin: 0; min-height: 1.4em; max-width: 30em; text-align: center; font-size: 16px; font-style: italic; color: var(--soft); }

#page { gap: 0; }
#bar, #sheet-bar { width: 100%; max-width: 760px; height: 44px; display: flex; align-items: center; justify-content: space-between; flex: none; }
#quit, #fermer { width: 44px; height: 44px; margin-left: -12px; font-size: 30px; line-height: 1; color: var(--soft); }
#regler, #mic { width: 44px; height: 44px; display: grid; place-items: center; color: var(--soft); }
#regler { margin-right: -10px; }
#mic .barre { display: none; }
#mic[aria-pressed="true"] .barre { display: inline; }
#mic[aria-pressed="true"] { opacity: 0.55; }
#systems { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 8px; align-items: center; flex: none; }
#systems svg { display: block; overflow: visible; }
#systems { margin: auto 0; }
#systems.chant { cursor: pointer; }
#systems.dire { gap: 22px; text-align: center; }
.consigne { margin: 0; max-width: 26em; color: var(--soft); font-style: italic; }
.mot { margin: 0; font-size: 34px; font-style: italic; min-height: 1.4em; }
.compte { margin: 0; font-size: 15px; color: var(--soft); }
#foot { width: 100%; max-width: 760px; padding-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 44px; }
#aides { display: flex; gap: 28px; }
#result { margin: 0; text-align: center; font-size: 16px; font-style: italic; color: var(--soft); min-height: 1.4em; }
#debug { width: 100%; max-width: 760px; margin: 0; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--soft); white-space: pre-wrap; word-break: break-word; }
#share { font: 13px/1.4 ui-monospace, Menlo, monospace; text-decoration: underline; min-height: 44px; }

#sheet {
  position: fixed; inset: 0; z-index: 5; overflow-y: auto; background: var(--paper); display: flex; flex-direction: column; align-items: center;
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
#sheet-bar span { font-size: 16px; font-style: italic; color: var(--soft); }
#reglages { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 6px; }
.rang { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }
.rang > span { font-size: 15px; font-style: italic; color: var(--soft); }
.pas { display: flex; align-items: center; justify-content: center; gap: 6px; }
.pas button { width: 44px; height: 44px; font-size: 26px; line-height: 1; color: var(--soft); }
.pas button:disabled { opacity: 0.25; }
.pas output { min-width: 3.6em; text-align: center; }
.etendue { display: flex; flex-direction: column; align-items: center; }
.etendue .pas { gap: 0; margin-top: -8px; }
.etendue .pas i { width: 18px; }
</style>
</head>
<body>
<main id="home">
  <h1>Solfège</h1>
  <nav id="liste" aria-label="Exercices">
    <p class="rubrique">Lecture</p>
    <div class="exos"><button type="button" data-exo="notes">Notes</button><button type="button" data-exo="noms">Intervalles</button></div>
    <p class="rubrique">Chant</p>
    <div class="exos"><button type="button" data-exo="intervalles">Intervalles</button><button type="button" data-exo="portee">Portée</button><button type="button" data-exo="accords">Accords</button><button type="button" data-exo="gammes">Gammes</button></div>
    <p class="rubrique">Reconnaissance</p>
    <div class="exos"><button type="button" data-exo="rIntervalles">Intervalles</button><button type="button" data-exo="rAccords">Accords</button><button type="button" data-exo="rGammes">Gammes</button></div>
  </nav>
  <button type="button" id="mainslibres" class="icone" aria-label="Mains libres"></button>
  <p id="msg" role="status"></p>
</main>
<main id="page" hidden>
  <div id="bar">
    <button type="button" id="quit" aria-label="Quitter l'exercice">×</button>
    <button type="button" id="mic" aria-label="Couper le micro" aria-pressed="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <rect id="niveau" x="9" y="3" width="6" height="11" rx="3" fill="#1F4E8C" fill-opacity="0"/>
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>
        <line class="barre" x1="4.5" y1="3.5" x2="19.5" y2="20.5"/>
      </svg>
    </button>
    <button type="button" id="regler" aria-label="Réglages">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <circle cx="12" cy="12" r="6.6" stroke-width="1.5"/><circle cx="12" cy="12" r="2.4" stroke-width="1.5"/>
        <path stroke-width="2.6" d="M19.4 12h2M17.23 17.23l1.42 1.42M12 19.4v2M6.77 17.23l-1.42 1.42M4.6 12h-2M6.77 6.77L5.35 5.35M12 4.6v-2M17.23 6.77l1.42-1.42"/>
      </svg>
    </button>
  </div>
  <div id="systems" aria-live="off"></div>
  <div id="foot">
    <div id="aides" hidden>
      <button type="button" class="icone" data-h="plaque" aria-label="Toutes les notes ensemble"></button>
      <button type="button" class="icone" data-h="arpege" aria-label="Les notes l'une après l'autre"></button>
    </div>
    <p id="result" role="status"></p>
    <pre id="debug" hidden></pre>
  </div>
</main>
<input type="file" id="import" accept=".wav,audio/wav,audio/x-wav" hidden>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Réglages" hidden>
  <div id="sheet-bar">
    <button type="button" id="fermer" aria-label="Fermer les réglages">×</button>
    <span>Réglages</span>
  </div>
  <div id="reglages"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
